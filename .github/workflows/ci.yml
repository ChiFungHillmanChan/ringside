name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # The Claude Code release Ringside is tested against. Raise it on purpose, after a run passes.
      CLAUDE_CODE_VERSION: 2.1.299
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Claude Code version
        run: claude --version

      - name: Validate the mod
        run: claude plugin validate .

      - name: Run the tests
        run: claude plugin test .
